[task]
name = "afterquery/autonomic-hrv-lmm"
description = "Process 250 Hz ECG recordings across baseline and nociceptive pain conditions using Butterworth bandpass filtering, Welch QRS-band SQI window gating, PCHIP ectopic beat interpolation, time- and Parseval-normalized Lomb-Scargle frequency-domain HRV extraction, and REML linear mixed-effects modeling for sex-specific autonomic reactivity."
authors = [{ name = "Dilek Ece Topbas", email = "dilekecetpbs@outlook.com" }]
keywords = ["electrocardiography", "heart-rate-variability", "lomb-scargle", "signal-quality-index", "nociceptive-pain", "mixed-effects-model"]

[metadata]
author_name = "Dilek Ece Topbas"
author_email = "dilekecetpbs@outlook.com"
author_organization = "Independent Biomedical Engineer"
author_profile = "https://www.linkedin.com/in/dilek-ece-topbas-9208101b6"
